<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEXBIZ · Web móvil</title>
  <meta name="description" content="Prototipo de la web móvil de VEXBIZ: la misma web, en la composición móvil del Figma, dentro de un marco de teléfono.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="../ds/tokens.css">
  <script>
    // En un teléfono no hace falta el marco: se abre la web directamente (ya se ve en su composición móvil).
    if (matchMedia('(max-width: 600px)').matches) location.replace('../web/index.html' + (location.hash || '#/'));
    // La versión anterior de esta carpeta era una PWA con service worker: se retira para que no sirva páginas viejas.
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.includes('/web-movil/')) r.unregister(); })).catch(() => {});
    try { const t = localStorage.getItem('vx-web-theme'); if (t) document.documentElement.setAttribute('data-theme', t); } catch (e) { /* sin almacenamiento */ }
  </script>
  <style>
    body { margin: 0; min-height: 100vh; font-family: var(--font-body); color: var(--md-sys-color-on-surface); background: var(--md-sys-color-surface-container); }
    .wm { display: grid; grid-template-columns: minmax(280px, 380px) auto; justify-content: center; gap: 56px; align-items: start; padding: 40px 24px; }
    .wm h1 { margin: 0 0 6px; font-family: var(--font-display); font-size: 32px; line-height: 1.15; }
    .wm p { margin: 0 0 16px; color: var(--md-sys-color-on-surface-variant); line-height: 1.5; }
    .wm h2 { margin: 24px 0 8px; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--md-sys-color-on-surface-variant); }
    .wm ul { display: grid; gap: 4px; margin: 0; padding: 0; list-style: none; }
    .wm button.go { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 44px; padding: 0 14px; border: 1px solid var(--md-sys-color-outline-variant); border-radius: 12px; background: var(--md-sys-color-surface-container-lowest); color: inherit; font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
    .wm button.go[aria-current="true"] { border-color: transparent; background: var(--vx-accent-soft); font-weight: 600; }
    .wm button.go small { color: var(--md-sys-color-on-surface-variant); font-size: 13px; }
    .wm .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 20px; }
    .wm .acts a, .wm .acts button { display: inline-flex; align-items: center; min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--vx-accent); color: var(--vx-n-900); font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; }
    .wm .acts .ghost { background: none; border: 1px solid var(--md-sys-color-outline); color: inherit; }
    .phone { position: sticky; top: 24px; width: 390px; box-sizing: content-box; height: min(844px, calc(100vh - 48px)); padding: 12px; border-radius: 48px; background: #14171c; box-shadow: 0 24px 60px rgb(0 0 0 / 0.28); }
    .phone iframe { display: block; width: 100%; height: 100%; border: 0; border-radius: 36px; background: #fff; }
    @media (max-width: 960px) { .wm { grid-template-columns: 1fr; justify-items: center; } .phone { position: static; } }
  </style>
</head>
<body>
<main class="wm">
  <section aria-labelledby="t">
    <h1 id="t">Web móvil de VEXBIZ</h1>
    <p>La misma web del prototipo, en la composición móvil del Figma: cabecera compacta, barra inferior, menús desplegables y pie en acordeón. Las 82 páginas funcionan aquí.</p>
    <h2>Pantallas del Figma móvil</h2>
    <ul data-list></ul>
    <div class="acts"><a href="../web/index.html#/indice" target="_blank" rel="noopener">Índice de las 82 páginas</a><button type="button" class="ghost" data-tema>Modo oscuro</button><a class="ghost" href="../web/index.html#/" target="_blank" rel="noopener">Abrir en escritorio</a></div>
  </section>
  <div class="phone"><iframe title="VEXBIZ web móvil" data-frame src="../web/index.html#/"></iframe></div>
</main>
<script>
  const PANTALLAS = [['01.01', 'Portada', '#/'], ['02.03', 'Portada del nicho', '#/nicho?id=clima'], ['02.05', 'Ficha de producto', '#/producto?id=aa12'], ['03.01', 'Carrito', '#/carrito'], ['03.02', 'Checkout · Paso 1', '#/pagar?paso=1'], ['05.01', 'Iniciar sesión', '#/entrar'], ['06.09', 'Mis compras', '#/compras'], ['09.01', 'Panel de la tienda', '#/mi-tienda']];
  const frame = document.querySelector('[data-frame]'), list = document.querySelector('[data-list]');
  list.innerHTML = PANTALLAS.map(([c, n, h]) => `<li><button class="go" type="button" data-h="${h}"><span>${n}</span><small>${c}</small></button></li>`).join('');
  const mark = (h) => list.querySelectorAll('.go').forEach((b) => b.setAttribute('aria-current', String(b.dataset.h === h)));
  list.addEventListener('click', (e) => { const b = e.target.closest('[data-h]'); if (!b) return; frame.contentWindow.location.hash = b.dataset.h; mark(b.dataset.h); });
  mark('#/');
  const tema = document.querySelector('[data-tema]');
  const pinta = () => { const d = document.documentElement.getAttribute('data-theme') === 'dark'; tema.textContent = d ? 'Modo claro' : 'Modo oscuro'; try { frame.contentDocument.documentElement.setAttribute('data-theme', d ? 'dark' : 'light'); } catch (e) { /* aún cargando */ } };
  tema.addEventListener('click', () => { const d = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', d); try { localStorage.setItem('vx-web-theme', d); } catch (e) { /* sin almacenamiento */ } pinta(); });
  // Como en un teléfono: sin barras de desplazamiento visibles dentro del marco.
  frame.addEventListener('load', () => { try { const s = frame.contentDocument.createElement('style'); s.textContent = 'html{scrollbar-width:none}html::-webkit-scrollbar{display:none}'; frame.contentDocument.head.append(s); } catch (e) { /* otro origen */ } pinta(); }); pinta();
</script>
</body>
</html>
